name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Install lint dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget
          mkdir -p /etc/apt/keyrings
          wget -qO /etc/apt/keyrings/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          chmod 0644 /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bear \
            build-essential \
            clang-22 \
            clang-format-22 \
            clang-tidy-22 \
            ca-certificates \
            git \
            libbz2-dev \
            libtool \
            pkg-config \
            ripgrep \
            shellcheck \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check out libmpq
        uses: actions/checkout@v7
        with:
          repository: mbroemme/libmpq
          ref: 911c5b6fbc863631ea65328ed2cecb1173f782a1 # v0.5.0
          path: .lint-libmpq
          persist-credentials: false

      - name: Install libmpq
        working-directory: .lint-libmpq
        run: |
          set -euxo pipefail
          prefix="$(mktemp -d)"
          sh -e autogen.sh
          ./configure --prefix="${prefix}"
          make -j"$(nproc)" -C src
          make -C src install
          make -C include/libmpq install
          make install-pkgconfigDATA
          printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig\n' "${prefix}" >> "${GITHUB_ENV}"

      - name: Run source checks
        env:
          CLANG_FORMAT: clang-format-22
        run: scripts/check

      - name: Run C standard compatibility checks
        run: PATH="/usr/lib/llvm-22/bin:${PATH}" scripts/check-c-standards

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure for clang-tidy
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr CC=clang-22

      - name: Build compilation database
        run: |
          set -euxo pipefail
          bear -- make -j"$(nproc)" V=1

      - name: Run clang-tidy
        run: |
          set -euxo pipefail
          mapfile -t sources < <(git ls-files 'src/*.c')
          if ((${#sources[@]} == 0)); then
            echo 'No C translation units found.' >&2
            exit 1
          fi
          clang-tidy-22 --quiet -p . "${sources[@]}"
